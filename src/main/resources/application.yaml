spring:
  application:
    name: Coparent backend
  datasource:
    url: jdbc:mysql://localhost:3306/coparent?createDatabaseIfNotExist=true
    username: root
    password: 40416804
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}  # Mailpit default (local dev inbox at http://localhost:8025)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only checks entities match it
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  auth:
    jwt-secret: ${JWT_SECRET:}  # >= 32 bytes; local value lives in config/application.yaml (git-ignored)
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-ttl: 15m  # 8-digit code typed in the app
    password-reset-ttl: 30m
    invitation-ttl: 7d  # lien d'invitation de l'autre parent
    check-compromised-passwords: true
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    mode: ${MAIL_MODE:smtp}  # smtp = send through spring.mail.*; log = only write links to the app log
    from: ${MAIL_FROM:Coparent <no-reply@coparent.local>}
